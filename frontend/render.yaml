services:
  # ─── POSTGRESQL DATABASE ──────────────────────────────
  - type: postgresql
    name: sigirl-db
    plan: starter
    region: oregon

  # ─── BACKEND DJANGO ────────────────────────────────────
  - type: web
    name: sigirl-backend
    env: python
    region: oregon
    plan: starter
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
    startCommand: gunicorn sigirl.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sigirl-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "sigirl-backend.onrender.com,sigirl-frontend.onrender.com"
      - key: VITE_API_URL
        value: "https://sigirl-backend.onrender.com/api/"

  # ─── FRONTEND REACT ────────────────────────────────────
  - type: web
    name: sigirl-frontend
    env: static
    region: oregon
    plan: starter
    buildCommand: |
      cd frontend
      npm install
      npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: "https://sigirl-backend.onrender.com/api/"
        